{% load static %}
<!doctype html>
<html lang="vi">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SnackShop</title>

    {% include 'includes/header.html' %}

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />
  </head>

  <body>
    <!-- NAVBAR LUÔN HIỆN -->
    {% include 'navbar.html' %}

    <!-- HERO CHỈ HIỆN KHI CẦN -->
    {% block hero %} {% endblock %}

    <!-- CONTENT -->
    <main style="margin-top: 90px">{% block content %} {% endblock %}</main>

    <!-- FOOTER -->
    {% include 'includes/footer.html' %}

    <!-- JS -->
    <script src="{% static 'js/jquery-3.4.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.js' %}"></script>
    <script src="{% static 'js/custom.js' %}"></script>

    <!-- LOADING PAGE SCRIPT -->
    <script>
      // Show navbar loader on page navigation
      document.addEventListener("click", function (e) {
        const target = e.target.closest("a");
        if (
          target &&
          target.href &&
          !target.target &&
          !target.classList.contains("add-to-cart-btn") &&
          !target.classList.contains("qty-btn") &&
          !target.classList.contains("remove-item-btn") &&
          !target.classList.contains("user_dropdown_btn") &&
          !target.classList.contains("dropdown_menu")
        ) {
          const href = target.getAttribute("href");
          if (
            href.startsWith("http") === false ||
            href.includes(window.location.hostname)
          ) {
            const navbarLoader = document.getElementById("navbar-loader");
            if (navbarLoader) {
              navbarLoader.classList.add("active");
            }
          }
        }
      });
    </script>
  </body>
</html>
