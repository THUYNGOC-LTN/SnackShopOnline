{% extends 'base.html' %}
{% load static %}
{% load custom_filters %}

{% block content %}

<section class="payment_section">

<div class="container d-flex justify-content-center">

<div class="payment_card text-center">

    <!-- ICON -->
    <div class="payment_icon">💳</div>

    <!-- TITLE -->
    <h2 class="payment_title">
        Thanh toán QR
    </h2>

    <p class="payment_subtitle">
        Quét mã để hoàn tất đơn hàng của bạn
    </p>

    <!-- QR -->
    <div class="qr_box">

        <img
            src="{{ qr_url }}"
            alt="QR Payment"
        >

    </div>

    <!-- INFO -->
    <div class="info_box">

        <div class="info_label">💰 Số tiền</div>
        <div class="money">
            {{ order.total_price|vnd }}
        </div>

        <hr>

        <div class="info_label">🧾 Nội dung chuyển khoản</div>

        <div id="transferContent" class="code_box">
            {{ order.order_code }}
        </div>

        <button class="copy_btn" onclick="copyText()">
            📋 Copy nội dung
        </button>

    </div>

    <!-- STATUS BOX -->
    <div id="statusBox" class="warning">
        ⏳ Đang chờ thanh toán...
    </div>

</div>

</div>

</section>

<script>

function copyText(){
    const text = document.getElementById("transferContent").innerText;
    navigator.clipboard.writeText(text);
    alert("Đã copy!");
}

let intervalId = null;
let isDone = false;

function updateStatus(message, type="warning") {

    const box = document.getElementById("statusBox");

    box.innerHTML = message;

    box.className = type; // warning / success / error
}

function checkPayment(){

    if (isDone) return;

    fetch("{% url 'check_payment' order.order_code %}")
        .then(res => res.json())
        .then(data => {

            if(data.status === "CONFIRMED"){

                isDone = true;

                updateStatus("✅ Thanh toán thành công! Đang chuyển hướng...", "success");

                clearInterval(intervalId);

                setTimeout(() => {
                    window.location.href =
                        "{% url 'order_success' order.order_code %}";
                }, 1200);
            }

            else if(data.status === "CANCELLED"){

                isDone = true;

                updateStatus("❌ Đơn hàng đã bị huỷ", "error");

                clearInterval(intervalId);
            }

            else if(data.status === "PENDING"){

                updateStatus("⏳ Đang chờ thanh toán...", "warning");
            }
        })
        .catch(() => {
            updateStatus("⚠️ Lỗi kết nối server", "error");
        });
}

// polling
intervalId = setInterval(checkPayment, 3000);

</script>

{% endblock %}
